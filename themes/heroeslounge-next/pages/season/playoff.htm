[SpoilersToggle]
==
{% put scripts %}
<script type="text/javascript">
{#- Ported from the FROZEN old-theme page (themes/HeroesLounge-Theme/pages/
    season/playoff.htm), retargeted from the legacy .result/.f100/.score/
    .opponent .name/.logo/.spoiler/.notext hooks onto the new .hl-* bracket
    hooks emitted by partials/PlayoffOverview/default.htm. The single masking
    class is `is-masked` (backed by components.css). The repeat-team + BYE +
    losers-bracket logic is preserved verbatim. -#}
function showHideSpoilersSeasonPlayoff(showSpoilers) {
    var scores = jQuery('.hl-score');
    var names = jQuery('.hl-name').not('.hl-tbd');
    var logos = names.siblings('.hl-logo');

    if (showSpoilers > 0) {
        scores.removeClass('is-masked');
        names.removeClass('is-masked');
        logos.removeClass('is-masked');
    } else {
        scores.addClass('is-masked');

        // allow first time names to be shown on first load when all names are spoilers
        names.removeClass('is-masked');
        logos.removeClass('is-masked');

        // find all first instances teams and hide subsequent instances of the team names and logos
        var seenTeams = [];
        var lastName = null;
        names.each(function () {
            var elem = jQuery(this);
            var name = elem.text();
            if (seenTeams.includes(name)) {
                elem.addClass('is-masked');
                elem.siblings('.hl-logo').addClass('is-masked');
            } else if (name == 'BYE!') {
                var index = seenTeams.indexOf(lastName);
                if (index > -1 && elem.closest("div.bracket-losers").length < 1) {
                    seenTeams.splice(index, 1);
                }
                elem.closest('.hl-node-card').find('.hl-score').removeClass('is-masked');
            } else {
                seenTeams.push(name);
            }
            lastName = name;
        });
    }
}
</script>
{% endput %}
{% component 'SpoilersToggle' callback='showHideSpoilersSeasonPlayoff' %}

{% component 'PlayoffOverview' %}
